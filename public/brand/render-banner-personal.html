<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1584px;height:396px}
/* layout mirrors the reference: logo top-left, centered copy + CTA, founder cutout anchored right.
   LinkedIn overlays the avatar circle bottom-left — keep x<400 / y>185 empty. */
body{background:linear-gradient(97deg,#1F1A13 18%,#120F0B 52%,#000 76%);position:relative;font-family:'Inter',sans-serif;overflow:hidden}
.wm{position:absolute;left:56px;top:36px;height:42px;width:auto}
/* brass block behind the founder cutout — matches the FINAL-brass-block profile pic */
.block{position:absolute;width:820px;height:820px;border-radius:50%;background:#C6A15B;left:1040px;top:210px}
.face{position:absolute;right:-16px;bottom:-105px;height:440px;width:auto}
.copy{position:absolute;left:380px;width:790px;top:98px;text-align:center}
h1{font-weight:800;font-size:48px;line-height:1.16;letter-spacing:-.038em;color:#ECE7DD;white-space:nowrap}
h1 .hi{font-family:'Fraunces',serif;font-style:italic;font-weight:500;letter-spacing:-.01em;color:#C6A15B;border-bottom:2px solid #C6A15B;padding-bottom:2px}
.sub{margin-top:18px;font-weight:500;font-size:24px;line-height:1.4;color:rgba(236,231,221,.85);white-space:nowrap}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:26px;background:#C6A15B;color:#0F0D0A;font-weight:700;font-size:21px;letter-spacing:.01em;padding:15px 34px;border-radius:999px}
</style></head><body>
<img class="wm" src="lockup-dark.svg" alt="">
<div class="block"></div>
<img class="face" src="adham-night-cutout.png" alt="">
<div class="copy">
  <h1>You didn't start your business<br><span class="hi">to do admin.</span></h1>
  <div class="sub">We take it off your plate with AI.</div>
  <div class="cta">book a 15 min no-pressure chat below &darr;</div>
</div>
</body></html>
